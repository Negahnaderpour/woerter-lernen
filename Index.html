<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0d1117"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="DeutschMeister"/>
<link rel="manifest" href="manifest.json"/>
<title>DeutschMeister</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,700;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --surface3: #30363d;
  --border: #30363d;
  --accent: #58a6ff;
  --accent2: #f78166;
  --gold: #e3b341;
  --green: #3fb950;
  --purple: #bc8cff;
  --text: #e6edf3;
  --muted: #7d8590;
  --radius: 12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;flex-direction:column;
}

/* HEADER */
.header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.logo{
  font-family:'Fraunces',serif;
  font-size:20px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.header-sub{font-size:11px;color:var(--muted);direction:rtl;}

/* NAV */
.nav{
  display:flex;
  background:var(--surface);
  border-top:1px solid var(--border);
  flex-shrink:0;order:3;
}
.nav-item{
  flex:1;padding:10px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;border-top:2px solid transparent;
  transition:all 0.2s;color:var(--muted);font-size:10px;
}
.nav-item.active{color:var(--accent);border-top-color:var(--accent);}
.nav-icon{font-size:20px;}

/* MAIN */
.main{flex:1;overflow-y:auto;order:2;}
.screen{display:none;padding:14px;}
.screen.active{display:block;}

/* CARDS */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;margin-bottom:12px;
}
.card-title{
  font-size:13px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px;
  margin-bottom:12px;direction:rtl;
}

/* BUTTONS */
.btn{
  padding:10px 18px;border-radius:8px;
  font-family:'Vazirmatn',sans-serif;font-size:14px;
  cursor:pointer;border:none;font-weight:600;
  transition:all 0.2s;direction:rtl;
}
.btn-primary{background:var(--accent);color:#0d1117;}
.btn-primary:active{opacity:0.8;}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:rgba(247,129,102,0.15);color:var(--accent2);border:1px solid rgba(247,129,102,0.3);}

/* INPUTS */
.input{
  width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;color:var(--text);
  font-family:'Vazirmatn',sans-serif;font-size:14px;
  outline:none;transition:border-color 0.2s;
}
.input:focus{border-color:var(--accent);}
.input::placeholder{color:var(--muted);}
textarea.input{resize:none;line-height:1.6;}

/* ══════════════════════════════
   SCREEN 1: NOTES / TEXTS
══════════════════════════════ */
.notes-toolbar{
  display:flex;gap:8px;margin-bottom:14px;
}
.notes-toolbar .input{flex:1;}

.note-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:10px;
  cursor:pointer;transition:border-color 0.2s;
}
.note-card:active{border-color:var(--accent);}
.note-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.note-title{font-size:15px;font-weight:600;color:var(--text);}
.note-tag{
  font-size:10px;padding:2px 8px;border-radius:10px;
  background:rgba(88,166,255,0.15);color:var(--accent);
  border:1px solid rgba(88,166,255,0.3);white-space:nowrap;
}
.note-preview{font-size:12px;color:var(--muted);line-height:1.5;direction:rtl;}
.note-date{font-size:11px;color:var(--muted);margin-top:6px;}

/* NOTE EDITOR */
.note-editor{display:none;}
.note-editor.open{display:flex;flex-direction:column;height:calc(100vh - 120px);}
.editor-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;
}
.editor-title-input{
  flex:1;background:transparent;border:none;
  color:var(--text);font-family:'Vazirmatn',sans-serif;
  font-size:18px;font-weight:700;outline:none;
  direction:rtl;
}
.editor-body{flex:1;display:flex;flex-direction:column;gap:8px;}
.editor-textarea{flex:1;min-height:200px;}
.tag-select{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;color:var(--text);
  font-family:'Vazirmatn',sans-serif;font-size:13px;outline:none;
}
.editor-actions{display:flex;gap:8px;margin-top:8px;}

/* ANALYZE RESULT */
.analyze-btn{
  background:linear-gradient(135deg,rgba(188,140,255,0.2),rgba(88,166,255,0.2));
  border:1px solid rgba(188,140,255,0.4);
  color:var(--purple);border-radius:8px;
  padding:10px 16px;font-family:'Vazirmatn',sans-serif;
  font-size:13px;cursor:pointer;width:100%;
  font-weight:600;direction:rtl;margin-top:8px;
  transition:all 0.2s;
}
.analyze-btn:active{opacity:0.8;}
.analysis-result{
  background:var(--surface2);border:1px solid rgba(188,140,255,0.3);
  border-radius:var(--radius);padding:14px;margin-top:10px;
  display:none;
}
.analysis-result.show{display:block;}
.analysis-loading{
  text-align:center;color:var(--muted);font-size:13px;
  direction:rtl;padding:20px 0;
}
.analysis-loading .spin{
  display:inline-block;font-size:24px;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.grammar-point{
  background:var(--surface);border-radius:8px;
  padding:12px;margin-bottom:8px;
  border-left:3px solid var(--purple);
}
.grammar-point-title{
  font-size:13px;font-weight:700;color:var(--purple);
  margin-bottom:4px;
}
.grammar-point-text{
  font-size:12px;color:var(--text);line-height:1.7;
  direction:rtl;
}

/* ══════════════════════════════
   SCREEN 2: VOCAB
══════════════════════════════ */
.vocab-search-row{display:flex;gap:8px;margin-bottom:12px;}
.cat-scroll{
  display:flex;gap:6px;overflow-x:auto;
  padding-bottom:8px;margin-bottom:12px;
  scrollbar-width:none;
}
.cat-scroll::-webkit-scrollbar{display:none;}
.chip{
  padding:5px 14px;border-radius:20px;font-size:12px;
  cursor:pointer;border:1px solid var(--border);
  background:var(--surface2);color:var(--muted);
  white-space:nowrap;transition:all 0.2s;direction:rtl;
  font-family:'Vazirmatn',sans-serif;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:700;}

.word-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 14px;
  margin-bottom:8px;cursor:pointer;transition:all 0.2s;
}
.word-item.expanded{border-color:rgba(88,166,255,0.4);}
.word-top{display:flex;justify-content:space-between;align-items:center;}
.word-de{font-size:16px;font-weight:700;}
.word-article{font-size:11px;color:var(--gold);font-weight:700;margin-right:5px;}
.word-fa{font-size:13px;color:var(--muted);margin-top:3px;direction:rtl;}
.word-badge{
  font-size:10px;padding:2px 7px;border-radius:8px;
  background:rgba(227,179,65,0.15);color:var(--gold);
  border:1px solid rgba(227,179,65,0.3);
}
.word-detail{
  display:none;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--border);
}
.word-item.expanded .word-detail{display:block;}
.example-de{font-size:12px;color:var(--green);font-style:italic;margin-bottom:2px;}
.example-fa{font-size:12px;color:var(--muted);direction:rtl;}
.learned-btn{
  margin-top:8px;padding:5px 12px;border-radius:16px;
  background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.3);
  color:var(--green);font-size:11px;cursor:pointer;
  font-family:'Vazirmatn',sans-serif;direction:rtl;
}
.learned-btn.on{background:rgba(63,185,80,0.25);border-color:var(--green);}

/* QUIZ */
.quiz-container{max-width:400px;margin:0 auto;}
.q-progress{display:flex;gap:3px;margin-bottom:16px;}
.q-dot{flex:1;height:3px;border-radius:2px;background:var(--surface3);}
.q-dot.done{background:var(--green);}
.q-dot.now{background:var(--accent);}
.q-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:24px;text-align:center;
  margin-bottom:16px;
}
.q-word{font-size:26px;font-weight:700;margin-bottom:6px;}
.q-sub{font-size:12px;color:var(--muted);}
.q-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.q-opt{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:13px 8px;
  color:var(--text);font-size:13px;cursor:pointer;
  font-family:'Vazirmatn',sans-serif;direction:rtl;
  transition:all 0.2s;
}
.q-opt.correct{background:rgba(63,185,80,0.2);border-color:var(--green);color:var(--green);}
.q-opt.wrong{background:rgba(247,129,102,0.2);border-color:var(--accent2);color:var(--accent2);}
.q-result{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:28px;text-align:center;
}
.q-score{font-size:56px;font-weight:700;color:var(--gold);}

/* ══════════════════════════════
   SCREEN 3: TEMPLATES
══════════════════════════════ */
.template-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:10px;
  cursor:pointer;transition:border-color 0.2s;
}
.template-card:active{border-color:var(--accent);}
.tpl-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.tpl-title{font-size:15px;font-weight:700;color:var(--text);}
.tpl-type{
  font-size:10px;padding:2px 8px;border-radius:8px;
  background:rgba(247,129,102,0.15);color:var(--accent2);
  border:1px solid rgba(247,129,102,0.3);
}
.tpl-desc{font-size:12px;color:var(--muted);direction:rtl;line-height:1.5;}
.tpl-body{
  display:none;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border);
}
.template-card.open .tpl-body{display:block;}
.tpl-text{
  font-size:12px;color:var(--text);line-height:1.8;
  background:var(--surface2);border-radius:8px;
  padding:12px;white-space:pre-wrap;
  border:1px solid var(--border);
}
.copy-btn{
  margin-top:8px;padding:7px 14px;border-radius:8px;
  background:rgba(88,166,255,0.15);border:1px solid rgba(88,166,255,0.3);
  color:var(--accent);font-size:12px;cursor:pointer;
  font-family:'Vazirmatn',sans-serif;direction:rtl;
}

/* ══════════════════════════════
   SCREEN 4: GRAMMAR
══════════════════════════════ */
.grammar-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:10px;overflow:hidden;
}
.grammar-header{
  padding:14px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
}
.grammar-name{font-size:15px;font-weight:700;color:var(--text);}
.grammar-fa{font-size:12px;color:var(--muted);direction:rtl;margin-top:2px;}
.grammar-arrow{color:var(--muted);transition:transform 0.2s;font-size:14px;}
.grammar-card.open .grammar-arrow{transform:rotate(90deg);}
.grammar-body{
  display:none;padding:0 14px 14px;
  border-top:1px solid var(--border);
  padding-top:12px;
}
.grammar-card.open .grammar-body{display:block;}
.rule-box{
  background:var(--surface2);border-radius:8px;
  padding:12px;margin-bottom:8px;
  border-left:3px solid var(--accent);
}
.rule-title{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:4px;text-transform:uppercase;}
.rule-text{font-size:13px;color:var(--text);line-height:1.7;direction:rtl;}
.example-row{
  background:rgba(63,185,80,0.08);border-radius:8px;
  padding:10px;margin-top:6px;
  border:1px solid rgba(63,185,80,0.2);
}
.ex-de{font-size:13px;color:var(--green);font-style:italic;margin-bottom:3px;}
.ex-fa{font-size:12px;color:var(--muted);direction:rtl;}
.wrong-row{
  background:rgba(247,129,102,0.08);border-radius:8px;
  padding:10px;margin-top:6px;
  border:1px solid rgba(247,129,102,0.2);
}
.ex-wrong{font-size:13px;color:var(--accent2);text-decoration:line-through;}

/* TOAST */
.toast{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(120px);
  background:var(--green);color:#0d1117;
  padding:10px 22px;border-radius:20px;
  font-size:13px;font-weight:700;z-index:9999;
  transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  direction:rtl;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* INSTALL */
#install-bar{
  display:none;background:linear-gradient(135deg,var(--accent),var(--purple));
  padding:10px 14px;direction:rtl;
  align-items:center;gap:8px;flex-shrink:0;
}
#install-bar.show{display:flex;}
#install-bar p{flex:1;font-size:12px;color:#fff;}
#install-bar button{
  background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);
  color:#fff;border-radius:6px;padding:5px 12px;
  font-size:12px;cursor:pointer;font-family:'Vazirmatn',sans-serif;
  white-space:nowrap;
}
</style>
</head>
<body>

<div id="install-bar">
  <button onclick="document.getElementById('install-bar').classList.remove('show')" style="background:none;border:none;color:rgba(255,255,255,0.7);font-size:16px;">✕</button>
  <p>DeutschMeister رو مثل اپ نصب کن!</p>
  <button id="install-btn">نصب ▼</button>
</div>

<header class="header">
  <div>
    <div class="logo">DeutschMeister</div>
    <div class="header-sub">دستیار یادگیری زبان آلمانی</div>
  </div>
  <div style="font-size:26px;">🇩🇪</div>
</header>

<div class="main">

  <!-- NOTES -->
  <div id="screen-notes" class="screen active">
    <div id="notes-list-view">
      <div class="notes-toolbar">
        <input class="input" id="note-search" placeholder="🔍 جستجو در یادداشت‌ها..." oninput="renderNotes()" style="direction:rtl;"/>
        <button class="btn btn-primary" onclick="openNewNote()" style="padding:10px 14px;white-space:nowrap;">+ جدید</button>
      </div>
      <div id="notes-filter" class="cat-scroll"></div>
      <div id="notes-list"></div>
    </div>
    <div id="note-editor" class="note-editor">
      <div class="editor-header">
        <button class="btn btn-ghost" onclick="closeEditor()" style="padding:8px 12px;">← برگشت</button>
        <input class="editor-title-input" id="editor-title" placeholder="عنوان یادداشت..."/>
      </div>
      <select class="tag-select" id="editor-tag" style="margin-bottom:8px;">
        <option value="عمومی">📌 عمومی</option>
        <option value="Forumsbeitrag">✍️ Forumsbeitrag</option>
        <option value="Brief">✉️ Brief / نامه</option>
        <option value="Beschwerde">⚠️ Beschwerde / شکایت</option>
        <option value="Bewerbung">💼 Bewerbung / درخواست کار</option>
        <option value="لغات">📚 لغات و عبارات</option>
        <option value="گرامر">🔤 گرامر</option>
        <option value="دیگر">📁 دیگر</option>
      </select>
      <div class="editor-body">
        <textarea class="input editor-textarea" id="editor-body" placeholder="متن یادداشت را اینجا بنویس...&#10;&#10;می‌توانی متن آلمانی وارد کنی تا AI آن را تحلیل کند."></textarea>
        <button class="analyze-btn" id="analyze-btn" onclick="analyzeText()">🤖 تحلیل هوشمند متن با AI ✨</button>
        <div class="analysis-result" id="analysis-result"></div>
      </div>
      <div class="editor-actions">
        <button class="btn btn-primary" onclick="saveNote()" style="flex:1;">💾 ذخیره</button>
        <button class="btn btn-danger" onclick="deleteNote()" id="delete-btn" style="display:none;">🗑 حذف</button>
      </div>
    </div>
  </div>

  <!-- VOCAB -->
  <div id="screen-vocab" class="screen">
    <div id="vocab-main">
      <div class="vocab-search-row">
        <input class="input" id="vocab-search" placeholder="🔍 جستجو..." oninput="renderVocab()" style="direction:rtl;flex:1;"/>
        <button class="btn btn-primary" onclick="showVocabAdd()" style="padding:10px 14px;white-space:nowrap;">+ لغت</button>
      </div>
      <div class="cat-scroll" id="vocab-cats"></div>
      <div id="vocab-list"></div>
      <div style="text-align:center;margin-top:16px;">
        <button class="btn btn-ghost" onclick="showQuiz()" style="width:100%;padding:13px;font-size:15px;">🧠 شروع کوییز</button>
      </div>
    </div>
    <div id="vocab-add-form" style="display:none;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <button class="btn btn-ghost" onclick="hideVocabAdd()" style="padding:8px 12px;">← برگشت</button>
        <span id="vocab-form-title" style="font-size:16px;font-weight:700;direction:rtl;">افزودن لغت جدید ✨</span>
      </div>
      <div class="card">
        <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:8px;">
          <input class="input" id="v-de" placeholder="لغت آلمانی *" />
          <select class="input" id="v-art" style="cursor:pointer;">
            <option value="">—</option>
            <option value="der">der</option>
            <option value="die">die</option>
            <option value="das">das</option>
          </select>
        </div>
        <input class="input" id="v-fa" placeholder="معنی فارسی *" style="direction:rtl;margin-bottom:8px;" />
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <select class="input" id="v-type" style="cursor:pointer;">
            <option value="Nomen">اسم</option>
            <option value="Verb">فعل</option>
            <option value="Adjektiv">صفت</option>
            <option value="Adverb">قید</option>
            <option value="Andere">دیگر</option>
          </select>
          <select class="input" id="v-cat" style="cursor:pointer;">
            <option value="عمومی">عمومی</option>
            <option value="کار">کار</option>
            <option value="احساس">احساسات</option>
            <option value="فناوری">فناوری</option>
            <option value="سیاست">سیاست</option>
            <option value="محیط">محیط زیست</option>
            <option value="ارتباط">ارتباط</option>
          </select>
        </div>
        <input class="input" id="v-ex" placeholder="مثال جمله (اختیاری)" style="margin-bottom:8px;" />
        <input class="input" id="v-exfa" placeholder="ترجمه مثال (اختیاری)" style="direction:rtl;margin-bottom:12px;" />
        <button id="vocab-save-btn" class="btn btn-primary" onclick="addVocab()" style="width:100%;padding:13px;">✅ افزودن لغت</button>
      </div>
    </div>
    <div id="quiz-view" style="display:none;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <button class="btn btn-ghost" onclick="hideQuiz()" style="padding:8px 12px;">← برگشت</button>
        <span style="font-size:16px;font-weight:700;">کوییز لغات 🧠</span>
      </div>
      <div class="quiz-container">
        <div id="quiz-setup-v">
          <div style="text-align:center;margin-bottom:20px;">
            <div style="font-size:48px;margin-bottom:8px;">🧠</div>
            <div style="font-size:13px;color:var(--muted);direction:rtl;">چند سوال؟</div>
          </div>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;">
            <button class="chip active" onclick="setQN(this,10)">۱۰ سوال</button>
            <button class="chip" onclick="setQN(this,20)">۲۰ سوال</button>
            <button class="chip" onclick="setQN(this,30)">۳۰ سوال</button>

function showScreen(name, el){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

function getNoteCategories(){
  const cats = ['همه',...new Set(notes.map(n=>n.tag))];
  return cats;
}
function renderNoteFilters(){
  const f = document.getElementById('notes-filter');
  f.innerHTML = getNoteCategories().map(c=>
    `<button class="chip ${c===noteFilter?'active':''}" onclick="setNoteFilter('${c}')">${c}</button>`
  ).join('');
}
function setNoteFilter(c){noteFilter=c;renderNotes();}

function renderNotes(){
  renderNoteFilters();
  const q = document.getElementById('note-search').value.toLowerCase();
  let list = notes;
  if(noteFilter!=='همه') list=list.filter(n=>n.tag===noteFilter);
  if(q) list=list.filter(n=>n.title.toLowerCase().includes(q)||n.body.toLowerCase().includes(q));
  const el = document.getElementById('notes-list');
  if(list.length===0){
    el.innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--muted);direction:rtl;">
      <div style="font-size:36px;margin-bottom:10px;">📝</div>
      هنوز یادداشتی نداری<br/>روی + جدید کلیک کن
    </div>`;
    return;
  }
  el.innerHTML = list.map(n=>`
    <div class="note-card" onclick="openNote(${n.id})">
      <div class="note-header">
        <div class="note-title">${n.title||'بدون عنوان'}</div>
        <span class="note-tag">${n.tag}</span>
      </div>
      <div class="note-preview">${(n.body||'').slice(0,100)}${n.body&&n.body.length>100?'...':''}</div>
      <div class="note-date">${new Date(n.date).toLocaleDateString('fa-IR')}</div>
    </div>
  `).join('');
}

function openNewNote(){
  currentNoteId = null;
  document.getElementById('editor-title').value='';
  document.getElementById('editor-body').value='';
  document.getElementById('editor-tag').value='عمومی';
  document.getElementById('analysis-result').classList.remove('show');
  document.getElementById('analysis-result').innerHTML='';
  document.getElementById('delete-btn').style.display='none';
  document.getElementById('notes-list-view').style.display='none';
  document.getElementById('note-editor').classList.add('open');
}

function openNote(id){
  const n = notes.find(x=>x.id===id);
  if(!n) return;
  currentNoteId = id;
  document.getElementById('editor-title').value=n.title;
  document.getElementById('editor-body').value=n.body;
  document.getElementById('editor-tag').value=n.tag;
  document.getElementById('analysis-result').classList.remove('show');
  document.getElementById('analysis-result').innerHTML='';
  document.getElementById('delete-btn').style.display='block';
  document.getElementById('notes-list-view').style.display='none';
  document.getElementById('note-editor').classList.add('open');
}

function closeEditor(){
  document.getElementById('note-editor').classList.remove('open');
  document.getElementById('notes-list-view').style.display='block';
  renderNotes();
}

function saveNote(){
  const title = document.getElementById('editor-title').value.trim();
  const body = document.getElementById('editor-body').value.trim();
  const tag = document.getElementById('editor-tag').value;
  if(!body){toast('❗ متن یادداشت خالی است');return;}
  if(currentNoteId){
    const n = notes.find(x=>x.id===currentNoteId);
    if(n){n.title=title||'بدون عنوان';n.body=body;n.tag=tag;n.date=Date.now();}
  } else {
    notes.unshift({id:Date.now(),title:title||'بدون عنوان',body,tag,date:Date.now()});
  }
  save();
  toast('✅ ذخیره شد!');
  closeEditor();
}

function deleteNote(){
  if(!currentNoteId) return;
  if(!confirm('حذف شود؟')) return;
  notes = notes.filter(n=>n.id!==currentNoteId);
  save();
  toast('🗑 حذف شد');
  closeEditor();
}

// ══════════════ AI ANALYZE ══════════════
async function analyzeText(){
  const text = document.getElementById('editor-body').value.trim();
  if(!text || text.length < 20){toast('❗ متن باید حداقل ۲۰ کاراکتر باشد');return;}
  
  const resultEl = document.getElementById('analysis-result');
  resultEl.classList.add('show');
  resultEl.innerHTML=`<div class="analysis-loading"><span class="spin">⚙️</span><br/>در حال تحلیل متن...</div>`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        system:`تو یک معلم حرفه‌ای زبان آلمانی هستی که به فارسی توضیح می‌دهی. وظیفه‌ات تحلیل متن آلمانی است. متن داده شده را تحلیل کن و نکات گرامری مهم را به فارسی توضیح بده. 

فقط JSON برگردان — بدون هیچ توضیح یا backtick:
{
  "level": "سطح تخمینی متن مثلاً B1/B2",
  "points": [
    {
      "title": "نام قاعده گرامری",
      "explanation": "توضیح کوتاه به فارسی — چه قاعده‌ای استفاده شده و چرا"
    }
  ],
  "tip": "یک نکته مهم یادگیری برای این متن به فارسی"
}

حداکثر ۴ نکته گرامری بنویس. اگر متن فارسی یا انگلیسی بود بگو متن باید آلمانی باشد.`,
        messages:[{role:"user",content:`این متن را تحلیل کن:\n\n${text}`}]
      })
    });
    const data = await res.json();
    const raw = data.content?.find(c=>c.type==='text')?.text||'{}';
    const clean = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    
    let html = `<div style="font-size:11px;color:var(--purple);font-weight:700;margin-bottom:10px;direction:rtl;">
      🤖 تحلیل هوشمند | سطح: <span style="color:var(--gold)">${parsed.level||'نامشخص'}</span>
    </div>`;
    
    (parsed.points||[]).forEach(p=>{
      html+=`<div class="grammar-point">
        <div class="grammar-point-title">📌 ${p.title}</div>
        <div class="grammar-point-text">${p.explanation}</div>
      </div>`;
    });
    
    if(parsed.tip){
      html+=`<div style="background:rgba(88,166,255,0.08);border-radius:8px;padding:10px;border:1px solid rgba(88,166,255,0.2);margin-top:4px;">
        <div style="font-size:11px;color:var(--accent);font-weight:700;margin-bottom:4px;">💡 نکته یادگیری</div>
        <div style="font-size:12px;color:var(--text);direction:rtl;line-height:1.6">${parsed.tip}</div>
      </div>`;
    }
    resultEl.innerHTML = html;
  } catch(e){
    resultEl.innerHTML=`<div style="color:var(--accent2);direction:rtl;font-size:13px;">❌ خطا در اتصال به AI. اینترنت را بررسی کن.</div>`;
  }
}

// ══════════════ VOCAB ══════════════
function renderVocab(){
  const cats = ['همه',...new Set(vocab.map(w=>w.cat))];
  document.getElementById('vocab-cats').innerHTML = cats.map(c=>
    `<button class="chip ${c===vocabFilter?'active':''}" onclick="setVF('${c}')">${c}</button>`
  ).join('');
  const q = document.getElementById('vocab-search').value.toLowerCase();
  let list = vocab;
  if(vocabFilter!=='همه') list=list.filter(w=>w.cat===vocabFilter);
  if(q) list=list.filter(w=>w.de.toLowerCase().includes(q)||w.fa.includes(q));
  const el = document.getElementById('vocab-list');
  if(!list.length){el.innerHTML=`<div style="text-align:center;padding:30px;color:var(--muted);">لغتی پیدا نشد</div>`;return;}
  el.innerHTML = list.map(w=>`
    <div class="word-item ${w.learned?'expanded':''}" id="wi-${w.id}" onclick="toggleWord(${w.id})">
      <div class="word-top">
        <div>
          ${w.article?`<span class="word-article">${w.article}</span>`:''}
          <span class="word-de">${w.de.replace(w.article+' ','').trim()}</span>
        </div>
        <span class="word-badge">${w.type}</span>
      </div>
      <div class="word-fa">${w.fa}</div>
      <div class="word-detail">
        ${w.ex?`<div class="example-de">${w.ex}</div><div class="example-fa">${w.exFa||''}</div>`:''}
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
          <button class="learned-btn ${w.learned?'on':''}" onclick="toggleLearned(event,${w.id})">
            ${w.learned?'✅ یاد گرفتم':'☑ علامت‌گذاری'}
          </button>
          <button class="learned-btn" onclick="editVocab(event,${w.id})" style="background:rgba(88,166,255,0.1);border-color:rgba(88,166,255,0.3);color:var(--accent);">✏️ ویرایش</button>
          <button class="learned-btn" onclick="deleteVocab(event,${w.id})" style="background:rgba(247,129,102,0.1);border-color:rgba(247,129,102,0.3);color:var(--accent2);">🗑 حذف</button>
        </div>
      </div>
    </div>
  `).join('');
}

function setVF(c){vocabFilter=c;renderVocab();}
function toggleWord(id){
  document.getElementById('wi-'+id)?.classList.toggle('expanded');
}
function toggleLearned(e,id){
  e.stopPropagation();
  const w=vocab.find(x=>x.id===id);
  if(w){w.learned=!w.learned;save();renderVocab();toast(w.learned?'✅ یاد گرفتی!':'↩ برداشته شد');}
}
function deleteVocab(e,id){
  e.stopPropagation();
  if(!confirm('این لغت حذف شود؟')) return;
  vocab = vocab.filter(x=>x.id!==id);
  save();renderVocab();toast('🗑 حذف شد');
}
function editVocab(e,id){
  e.stopPropagation();
  const w = vocab.find(x=>x.id===id);
  if(!w) return;
  // پر کردن فرم با اطلاعات لغت
  document.getElementById('v-de').value = w.de;
  document.getElementById('v-fa').value = w.fa;
  document.getElementById('v-art').value = w.article||'';
  document.getElementById('v-type').value = w.type||'Nomen';
  document.getElementById('v-cat').value = w.cat||'عمومی';
  document.getElementById('v-ex').value = w.ex||'';
  document.getElementById('v-exfa').value = w.exFa||'';
  // ذخیره ID برای ویرایش
  document.getElementById('vocab-add-form').dataset.editId = id;
  document.getElementById('vocab-form-title').textContent = '✏️ ویرایش لغت';
  document.getElementById('vocab-save-btn').textContent = '✅ ذخیره تغییرات';
  showVocabAdd();
}
function showVocabAdd(){
  document.getElementById('vocab-main').style.display='none';
  document.getElementById('vocab-add-form').style.display='block';
}
function hideVocabAdd(){
  document.getElementById('vocab-main').style.display='block';
  document.getElementById('vocab-add-form').style.display='none';
}
function addVocab(){
  const de=document.getElementById('v-de').value.trim();
  const fa=document.getElementById('v-fa').value.trim();
  if(!de||!fa){toast('❗ لغت و معنی الزامی');return;}
  const form=document.getElementById('vocab-add-form');
  const editId=form.dataset.editId;
  if(editId){
    const w=vocab.find(x=>x.id===parseInt(editId));
    if(w){
      w.de=de;w.fa=fa;
      w.article=document.getElementById('v-art').value;
      w.type=document.getElementById('v-type').value;
      w.cat=document.getElementById('v-cat').value;
      w.ex=document.getElementById('v-ex').value.trim();
      w.exFa=document.getElementById('v-exfa').value.trim();
    }
    delete form.dataset.editId;
    document.getElementById('vocab-form-title').textContent='افزودن لغت جدید ✨';
    document.getElementById('vocab-save-btn').textContent='✅ افزودن لغت';
    toast('✅ ویرایش ذخیره شد!');
  } else {
    vocab.unshift({
      id:Date.now(),de,fa,
      article:document.getElementById('v-art').value,
      type:document.getElementById('v-type').value,
      cat:document.getElementById('v-cat').value,
      ex:document.getElementById('v-ex').value.trim(),
      exFa:document.getElementById('v-exfa').value.trim(),
      learned:false
    });
    toast('✅ لغت اضافه شد!');
  }
  save();
  ['v-de','v-fa','v-ex','v-exfa'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('v-art').value='';
  hideVocabAdd();
  renderVocab();
}

// ══════════════ QUIZ ══════════════
function showQuiz(){document.getElementById('vocab-main').style.display='none';document.getElementById('quiz-view').style.display='block';}
function hideQuiz(){document.getElementById('quiz-view').style.display='none';document.getElementById('vocab-main').style.display='block';}
function backToQuizSetup(){
  document.getElementById('quiz-active-v').style.display='none';
  document.getElementById('quiz-result-v').style.display='none';
  document.getElementById('quiz-setup-v').style.display='block';
}
function setQN(btn,n){
  qCount=n;
  document.querySelectorAll('#quiz-setup-v .chip').forEach(c=>{
    if(['۱۰ سوال','۲۰ سوال','۳۰ سوال'].includes(c.textContent)) c.classList.remove('active');
  });
  btn.classList.add('active');
}
function setQM(m,btn){
  qMode=m;
  document.getElementById('qm-de').classList.toggle('active',m==='de');
  document.getElementById('qm-fa').classList.toggle('active',m==='fa');
}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}
function startQuiz(){
  if(vocab.length<4){toast('❗ حداقل ۴ لغت لازم است');return;}
  qList=shuffle(vocab).slice(0,Math.min(qCount,vocab.length));
  qIdx=0;qScore=0;qAnswered=false;
  document.getElementById('quiz-setup-v').style.display='none';
  document.getElementById('quiz-result-v').style.display='none';
  document.getElementById('quiz-active-v').style.display='block';
  renderQ();
}
function renderQ(){
  if(qIdx>=qList.length){showQResult();return;}
  qAnswered=false;
  const q=qList[qIdx];
  document.getElementById('q-prog').innerHTML=qList.map((_,i)=>
    `<div class="q-dot ${i<qIdx?'done':i===qIdx?'now':''}"></div>`).join('');
  if(qMode==='de'){
    document.getElementById('q-label').textContent='معنی فارسی این لغت؟';
    document.getElementById('q-word').textContent=(q.article?q.article+' ':'')+q.de.replace(q.article+' ','').trim();
    document.getElementById('q-hint').textContent=q.type;
  } else {
    document.getElementById('q-label').textContent='کدام لغت آلمانی درست است؟';
    document.getElementById('q-word').textContent=q.fa;
    document.getElementById('q-hint').textContent='';
  }
  const others=shuffle(vocab.filter(w=>w.id!==q.id)).slice(0,3);
  const opts=shuffle([q,...others]);
  document.getElementById('q-opts').innerHTML=opts.map(o=>{
    const val=qMode==='de'?o.fa:((o.article?o.article+' ':'')+o.de.replace(o.article+' ','').trim());
    const correct=qMode==='de'?q.fa:((q.article?q.article+' ':'')+q.de.replace(q.article+' ','').trim());
    return `<button class="q-opt" onclick="selectOpt(this,'${val.replace(/'/g,"\\'")}','${correct.replace(/'/g,"\\'")}',${q.id})">${val}</button>`;
  }).join('');
}
function selectOpt(btn,selected,correct,qId){
  if(qAnswered)return;
  qAnswered=true;
  const ok=selected===correct;
  if(ok){btn.classList.add('correct');qScore++;}
  else{
    btn.classList.add('wrong');
    document.querySelectorAll('.q-opt').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('correct');});
  }
  setTimeout(()=>{qIdx++;renderQ();},1100);
}
function skipQ(){qIdx++;renderQ();}
function showQResult(){
  document.getElementById('quiz-active-v').style.display='none';
  document.getElementById('quiz-result-v').style.display='block';
  document.getElementById('q-score-val').textContent=qScore;
  document.getElementById('q-score-of').textContent='از '+qList.length;
  const p=qScore/qList.length;
  document.getElementById('q-msg').textContent=p>=0.8?'🎉 عالی! آفرین!':p>=0.6?'👍 خوب بود، ادامه بده!':'💪 تمرین بیشتری لازم است';
}

// ══════════════ TEMPLATES ══════════════
function renderTemplates(){
  document.getElementById('templates-list').innerHTML = TEMPLATES.map((t,i)=>`
    <div class="template-card" id="tpl-${i}" onclick="toggleTpl(${i})">
      <div class="tpl-header">
        <div class="tpl-title">${t.title}</div>
        <span class="tpl-type">${t.type}</span>
      </div>
      <div class="tpl-desc">${t.desc}</div>
      <div class="tpl-body">
        <div class="tpl-text">${t.text}</div>
        <button class="copy-btn" onclick="copyTpl(event,${i})">📋 کپی متن</button>
        <button class="copy-btn" onclick="useTemplate(event,${i})" style="margin-right:8px;background:rgba(63,185,80,0.15);border-color:rgba(63,185,80,0.3);color:var(--green);">✍️ استفاده در یادداشت</button>
      </div>
    </div>
  `).join('');
}
function toggleTpl(i){document.getElementById('tpl-'+i)?.classList.toggle('open');}
function copyTpl(e,i){e.stopPropagation();navigator.clipboard?.writeText(TEMPLATES[i].text)||'';toast('📋 کپی شد!');}
function useTemplate(e,i){
  e.stopPropagation();
  const t=TEMPLATES[i];
  currentNoteId=null;
  document.getElementById('editor-title').value=t.title;
  document.getElementById('editor-body').value=t.text;
  document.getElementById('editor-tag').value=t.type==='Forumsbeitrag'?'Forumsbeitrag':t.type==='Brief'?'Brief':t.type==='Bewerbung'?'Bewerbung':'عمومی';
  document.getElementById('analysis-result').classList.remove('show');
  document.getElementById('delete-btn').style.display='none';
  // switch to notes
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('screen-notes').classList.add('active');
  document.querySelector('.nav-item').classList.add('active');
  document.getElementById('notes-list-view').style.display='none';
  document.getElementById('note-editor').classList.add('open');
  toast('✅ قالب در یادداشت باز شد!');
}

function askGrammar(){
  const q = document.getElementById('grammar-input').value.trim().toLowerCase();
  if(!q){toast('❗ موضوع را بنویس');return;}
  
  // جستجو در دیتابیس
  let found = null;
  const keys = Object.keys(GRAMMAR_DB);
  for(let k of keys){
    const g = GRAMMAR_DB[k];
    const searchIn = (g.title+' '+g.summary+' '+g.level).toLowerCase();
    const qWords = q.split(' ');
    if(qWords.some(w => w.length>2 && searchIn.includes(w))){
      found = {idx:k, ...g};
      break;
    }
  }
  
  // اگر پیدا نشد، اولین چیپ مرتبط را نشان بده
  if(!found){
    document.getElementById('grammar-result').innerHTML=`
      <div style="background:rgba(247,129,102,0.1);border:1px solid rgba(247,129,102,0.3);border-radius:12px;padding:16px;direction:rtl;text-align:center;">
        <div style="font-size:20px;margin-bottom:8px;">🔍</div>
        <div style="font-size:14px;color:var(--text);margin-bottom:6px;">نتیجه‌ای پیدا نشد</div>
        <div style="font-size:12px;color:var(--muted);">از چیپ‌های بالا موضوع را انتخاب کن</div>
      </div>`;
    return;
  }
  showGrammarCard(found);
}

  resultEl.innerHTML = `
    <div class="grammar-card" style="border-color:rgba(88,166,255,0.3);margin-bottom:12px;">
      <div style="padding:14px;border-bottom:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div class="grammar-name">${g.title}</div>
            <div class="grammar-fa">${g.summary}</div>
          </div>
          <span style="font-size:11px;padding:3px 10px;border-radius:8px;background:rgba(88,166,255,0.15);color:var(--accent);border:1px solid rgba(88,166,255,0.3);">${g.level}</span>
        </div>
      </div>
      <div class="grammar-body" style="display:block;">

function saveGrammarItem(g){
  if(grammarSaved.find(x=>x.title===g.title)){toast('قبلاً ذخیره شده!');return;}
  grammarSaved.unshift({...g, savedAt:Date.now()});
  localStorage.setItem('dm_grammar_saved',JSON.stringify(grammarSaved));
  renderGrammarSaved();
  toast('📌 ذخیره شد!');
}

function saveGrammar(p){
  if(grammarSaved.find(g=>g.title===p.title)){toast('قبلاً ذخیره شده!');return;}
  grammarSaved.unshift({...p, savedAt: Date.now()});
  localStorage.setItem('dm_grammar_saved', JSON.stringify(grammarSaved));
  renderGrammarSaved();
  toast('📌 ذخیره شد!');
}

function renderGrammarSaved(){
  const sec = document.getElementById('grammar-saved-section');
  const list = document.getElementById('grammar-saved-list');
  if(!grammarSaved.length){sec.style.display='none';return;}
  sec.style.display='block';
  list.innerHTML = grammarSaved.map((g,i)=>`
    <div class="grammar-card" id="gs-${i}">
      <div class="grammar-header" onclick="toggleGS(${i})" style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="grammar-name">${g.title}</div>
          <div class="grammar-fa">${g.summary||''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:10px;color:var(--accent);">${g.level||''}</span>
          <span class="grammar-arrow">›</span>
        </div>
      </div>
      <div class="grammar-body">
        ${(g.rules||[]).map(r=>`
          <div class="rule-box">
            <div class="rule-title">${r.title}</div>
            <div class="rule-text">${(r.text||'').replace(/\n/g,'<br/>')}</div>
          </div>`).join('')}
        ${(g.examples||[]).map(ex=>`
          <div class="example-row">
            <div class="ex-de">✅ ${ex.de}</div>
            <div class="ex-fa">${ex.fa}</div>
          </div>`).join('')}
        ${g.tip?`<div style="background:rgba(227,179,65,0.08);border:1px solid rgba(227,179,65,0.25);border-radius:8px;padding:10px;margin-top:6px;">
          <div style="font-size:11px;color:var(--gold);font-weight:700;margin-bottom:4px;">💡 نکته طلایی</div>
          <div style="font-size:12px;color:var(--text);direction:rtl;line-height:1.6;">${g.tip}</div>
        </div>`:''}
        <button onclick="deleteGrammar(${i})" style="margin-top:8px;padding:5px 12px;border-radius:8px;background:rgba(247,129,102,0.1);border:1px solid rgba(247,129,102,0.3);color:var(--accent2);font-size:11px;cursor:pointer;font-family:'Vazirmatn',sans-serif;">
          🗑 حذف
        </button>
      </div>
    </div>
  `).join('');
}

function toggleGS(i){document.getElementById('gs-'+i)?.classList.toggle('open');}
function deleteGrammar(i){
  grammarSaved.splice(i,1);
  localStorage.setItem('dm_grammar_saved',JSON.stringify(grammarSaved));
  renderGrammarSaved();
  toast('🗑 حذف شد');
}

// ══════════════ TOAST ══════════════
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  if(toastTimer) clearTimeout(toastTimer);
  el.classList.remove('show');
  el.textContent = msg;
  void el.offsetWidth;
  el.classList.add('show');
  toastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 2500);
}

// ══════════════ PWA ══════════════
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('install-bar').classList.add('show');
});
document.getElementById('install-btn').addEventListener('click',()=>{
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{
    deferredPrompt=null;document.getElementById('install-bar').classList.remove('show');
  });}
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ══════════════ INIT ══════════════
renderNotes();
</script>
